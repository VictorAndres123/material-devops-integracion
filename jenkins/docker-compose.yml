# Servidor CI. El docker-compose.yml de la raíz levanta la API;
# este levanta Jenkins. Se ejecuta desde esta carpeta: docker compose up -d --build
services:
  jenkins:
    build: .                         # construye la imagen desde ./Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"               # interfaz web
      - "50000:50000"             # agentes JNLP
    volumes:
      - jenkins_home:/var/jenkins_home  # datos persistentes (jobs, plugins, credenciales)
      - /var/run/docker.sock:/var/run/docker.sock  # socket del daemon de Docker Desktop

volumes:
  jenkins_home:
